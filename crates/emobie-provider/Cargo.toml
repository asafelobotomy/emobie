[package]
name = "emobie-provider"
version = "0.8.2"
edition = "2021"
description = "emobie's emoji search for uQ's launcher (org.uq.Launcher1.Provider on the session bus)"
license = "MIT"
publish = false

[[bin]]
name = "emobie-provider"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy", "service"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

# Standalone like emobie-inputd: keeps this crate out of any workspace above it.
[workspace]
