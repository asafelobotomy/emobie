[package]
name = "emobie-inputd"
version = "0.6.5"
edition = "2021"
description = "Privileged input helper for emobie text expansion"
license = "MIT"

[[bin]]
name = "emobie-inputd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = { version = "0.3", default-features = false, features = ["x11rb", "wayland", "libei"] }
evdev = "0.12"
nix = { version = "0.29", features = ["fs", "uio", "socket", "user"] }
ctrlc = "3"
