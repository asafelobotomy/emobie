[package]
name = "emobie-inputd"
version = "0.6.27"
edition = "2021"
description = "Privileged input helper for emobie text expansion"
license = "MIT"

[[bin]]
name = "emobie-inputd"
path = "src/main.rs"

[features]
default = []
# Experimental Emulated Input path (portal/EIS). Prefer system `eitype` when available.
libei = ["dep:reis", "dep:ashpd", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
# libei is intentionally omitted from enigo: 0.3 unwraps on missing RemoteDesktop portal
# and panics/hangs on X11 (and some Wayland) sessions, killing the listen thread.
enigo = { version = "0.3", default-features = false, features = ["x11rb", "wayland"] }
# Also pulled in transitively by enigo's x11rb feature; declared directly
# here for the focused-window WM_CLASS lookup in focused_window/x11.rs.
x11rb = "0.13"
evdev = "0.12"
xkbcommon = "0.8"
nix = { version = "0.29", features = ["fs", "uio", "socket", "user", "poll"] }
ctrlc = "3"
reis = { version = "0.7", optional = true }
ashpd = { version = "0.11", optional = true, features = ["tokio"] }
tokio = { version = "1", optional = true, features = ["rt", "macros"] }
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking", "blocking-api"] }
