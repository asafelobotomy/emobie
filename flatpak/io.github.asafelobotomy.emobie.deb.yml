# GitHub Release Flatpak — wraps the prebuilt .deb (fast CI packaging).
# Flathub-bound source build lives in io.github.asafelobotomy.emobie.yml.
#
# Local example (after `npm run tauri build -- --bundles deb`):
#   cp src-tauri/target/release/bundle/deb/*.deb flatpak/emobie.deb
#   flatpak-builder --force-clean --user --repo=flatpak/repo flatpak/build-dir \
#     flatpak/io.github.asafelobotomy.emobie.deb.yml
#   flatpak build-bundle flatpak/repo emobie.flatpak io.github.asafelobotomy.emobie

id: io.github.asafelobotomy.emobie
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: emobie

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.x.StatusNotifierWatcher
  - --talk-name=org.kde.KWin
  # Optional host emobie-inputd socket (as-you-type / auto-paste). No --device=input.
  - --filesystem=xdg-run/emobie
  - --filesystem=xdg-data/emobie:create
  # GitHub Releases .deb wrap only: host autostart desktop entry.
  # Flathub-bound source manifest must not use this (Autostart portal instead).
  - --own-name=org.kde.StatusNotifierItem.*
  - --filesystem=xdg-config/autostart:create

modules:
  - name: emobie
    buildsystem: simple
    sources:
      - type: file
        path: emobie.deb
      - type: file
        path: io.github.asafelobotomy.emobie.metainfo.xml
      - type: file
        path: io.github.asafelobotomy.emobie.desktop
    build-commands:
      - set -euo pipefail
      - mkdir -p deb-extract
      - |
        (
          cd deb-extract
          ar -x ../emobie.deb
          tar -xf data.tar.*
        )
      - install -Dm755 deb-extract/usr/bin/emobie /app/bin/emobie
      - |
        if [ -d deb-extract/usr/lib/emobie ]; then
          mkdir -p /app/lib/emobie
          cp -a deb-extract/usr/lib/emobie/. /app/lib/emobie/
          find /app/lib/emobie -type f -exec chmod 644 {} \;
          find /app/lib/emobie -type d -exec chmod 755 {} \;
        fi
      - install -Dm644 io.github.asafelobotomy.emobie.desktop /app/share/applications/io.github.asafelobotomy.emobie.desktop
      - |
        ICON_ID=io.github.asafelobotomy.emobie
        for pair in \
          "16x16:16x16" "22x22:22x22" "24x24:24x24" "32x32:32x32" \
          "48x48:48x48" "64x64:64x64" "128x128:128x128" \
          "256x256:256x256" "256x256@2:256x256" "512x512:512x512"; do
          src_size="${pair%%:*}"
          dest_size="${pair##*:}"
          src="deb-extract/usr/share/icons/hicolor/${src_size}/apps"
          if [ -d "$src" ]; then
            icon="$(find "$src" -maxdepth 1 -type f \( -name '*.png' -o -name '*.svg' \) | head -n1 || true)"
            if [ -n "$icon" ]; then
              install -Dm644 "$icon" \
                "/app/share/icons/hicolor/${dest_size}/apps/${ICON_ID}.${icon##*.}"
            fi
          fi
        done
        # Prefer correctly named files when present.
        for size in 16x16 22x22 24x24 32x32 48x48 64x64 128x128 256x256 512x512; do
          for name in "$ICON_ID" emobie; do
            f="deb-extract/usr/share/icons/hicolor/${size}/apps/${name}.png"
            if [ -f "$f" ]; then
              install -Dm644 "$f" "/app/share/icons/hicolor/${size}/apps/${ICON_ID}.png"
              break
            fi
          done
        done
      - install -Dm644 io.github.asafelobotomy.emobie.metainfo.xml \
          /app/share/metainfo/io.github.asafelobotomy.emobie.metainfo.xml
      # Host Expand bootstrap (same assets as Flathub source Flatpak).
      - |
        set -euo pipefail
        SHARE=/app/share/emobie
        HOST="$SHARE/host-bundle"
        mkdir -p "$HOST/selinux"
        if [ -x deb-extract/usr/bin/emobie-inputd ]; then
          install -Dm755 deb-extract/usr/bin/emobie-inputd "$HOST/emobie-inputd"
        else
          echo "emobie.deb missing usr/bin/emobie-inputd" >&2
          exit 1
        fi
        for asset in setup-input-access.sh 99-emobie-input.rules \
          io.github.asafelobotomy.emobie.inputd.policy bootstrap-inputd-host.sh; do
          if [ -f "deb-extract/usr/share/emobie/$asset" ]; then
            install -Dm755 "deb-extract/usr/share/emobie/$asset" "$HOST/$asset" 2>/dev/null \
              || install -Dm644 "deb-extract/usr/share/emobie/$asset" "$HOST/$asset"
          fi
        done
        # Rules/policy are data; bootstrap/setup are scripts.
        [ -f "$HOST/setup-input-access.sh" ] && chmod 755 "$HOST/setup-input-access.sh" || true
        [ -f "$HOST/bootstrap-inputd-host.sh" ] && chmod 755 "$HOST/bootstrap-inputd-host.sh" || true
        if [ ! -f "$HOST/bootstrap-inputd-host.sh" ]; then
          # Minimal bootstrap when the deb did not ship the host script.
          cat >"$HOST/bootstrap-inputd-host.sh" <<'BOOT'
#!/usr/bin/env bash
set -euo pipefail
SOURCE="${1:?}"
BIN_DIR="${XDG_BIN_HOME:-$HOME/.local/bin}"
UNIT_DIR="${XDG_CONFIG_HOME:-$HOME/.config}/systemd/user"
DATA="${XDG_DATA_HOME:-$HOME/.local/share}/emobie"
ASSET_DIR="$(dirname "$(readlink -f "$SOURCE")")"
mkdir -p "$BIN_DIR" "$UNIT_DIR" "$DATA"
install -m755 "$SOURCE" "$BIN_DIR/emobie-inputd"
for asset in setup-input-access.sh 99-emobie-input.rules io.github.asafelobotomy.emobie.inputd.policy; do
  [[ -f "$ASSET_DIR/$asset" ]] || continue
  if [[ "$asset" == *.sh ]]; then install -Dm755 "$ASSET_DIR/$asset" "$DATA/$asset"
  else install -Dm644 "$ASSET_DIR/$asset" "$DATA/$asset"; fi
done
cat >"$UNIT_DIR/emobie-inputd.service" <<EOF
[Unit]
Description=emobie input helper
After=graphical-session.target
PartOf=graphical-session.target
[Service]
Type=simple
ExecStart=$BIN_DIR/emobie-inputd
Restart=on-failure
RestartSec=2
NoNewPrivileges=true
PassEnvironment=WAYLAND_DISPLAY DISPLAY XAUTHORITY XDG_RUNTIME_DIR
[Install]
WantedBy=graphical-session.target
EOF
systemctl --user daemon-reload
systemctl --user disable emobie-inputd.service >/dev/null 2>&1 || true
systemctl --user enable emobie-inputd.service
systemctl --user restart emobie-inputd.service
BOOT
          chmod 755 "$HOST/bootstrap-inputd-host.sh"
        fi
        if [ -f deb-extract/usr/share/emobie/selinux/emobie-inputd.te ]; then
          install -Dm644 deb-extract/usr/share/emobie/selinux/emobie-inputd.te \
            "$HOST/selinux/emobie-inputd.te"
        fi
        tar czf "$SHARE/inputd-host-bundle.tgz" -C "$HOST" .
        rm -rf "$HOST"
