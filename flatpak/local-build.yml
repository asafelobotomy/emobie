# Local-only build for installing the current commit as a Flatpak on this
# machine. Not for Flathub (uses network during build instead of the
# pre-vendored offline sources).
#
# Needs org.flatpak.Builder, org.gnome.Sdk//50 and the rust-stable and node22
# SDK extensions on branch 25.08 (what GNOME 50's Sdk asks for), plus
# `git submodule update --init flatpak/shared-modules`. From the repo root:
#
#   flatpak run org.flatpak.Builder --force-clean --user --install \
#     flatpak/build-dir-local flatpak/local-build.yml

id: io.github.asafelobotomy.emobie
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: emobie

sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node22

finish-args:
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --share=ipc
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.x.StatusNotifierWatcher
  - --talk-name=org.kde.KWin
  # Enables `flatpak-spawn --host`: bootstraps/restarts the host emobie-inputd
  # helper, checks/repairs the udev+group permanent-access setup, and
  # self-update. (KWin pin talks to org.kde.KWin directly.) Every call site uses a
  # hardcoded argv, never shell-interpolated user input. See "Remaining before
  # Flathub" in docs/FLATHUB.md for the full audit of this permission.
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-run/emobie
  - --filesystem=xdg-data/emobie:create

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network

modules:
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: emobie
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/emobie/cargo
        XDG_CACHE_HOME: /run/build/emobie/flatpak-node/cache
        npm_config_cache: /run/build/emobie/flatpak-node/npm-cache
      build-args:
        - --share=network
    sources:
      - type: dir
        # The checkout this manifest lives in (relative to this file).
        path: ..
        skip:
          - .flatpak-builder
          - flatpak/build-dir-local
          # Host build outputs: rebuilt inside the sandbox, and several GB.
          - node_modules
          - dist
          - src-tauri/target
          - crates/emobie-inputd/target
      - type: file
        path: io.github.asafelobotomy.emobie.metainfo.xml
      - type: file
        path: io.github.asafelobotomy.emobie.desktop
    build-commands:
      - npm ci --legacy-peer-deps
      - npm run tauri build -- --no-bundle
      - cargo build --release --manifest-path crates/emobie-inputd/Cargo.toml
      - bash scripts/stage-inputd.sh
      - install -Dm755 src-tauri/target/release/emobie /app/bin/emobie
      - install -Dm644 src-tauri/inputd-bundle/inputd-host-bundle.tgz /app/share/emobie/inputd-host-bundle.tgz
      - install -Dm644 io.github.asafelobotomy.emobie.desktop /app/share/applications/io.github.asafelobotomy.emobie.desktop
      - install -Dm644 io.github.asafelobotomy.emobie.metainfo.xml /app/share/metainfo/io.github.asafelobotomy.emobie.metainfo.xml
      - install -Dm644 src-tauri/icons/16x16.png /app/share/icons/hicolor/16x16/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/22x22.png /app/share/icons/hicolor/22x22/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/24x24.png /app/share/icons/hicolor/24x24/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/48x48.png /app/share/icons/hicolor/48x48/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/256x256.png /app/share/icons/hicolor/256x256/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.asafelobotomy.emobie.png
      - install -Dm644 LICENSE /app/share/licenses/io.github.asafelobotomy.emobie/LICENSE
