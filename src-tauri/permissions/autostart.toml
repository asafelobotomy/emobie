[[permission]]
identifier = "allow-set-launch-on-startup"
description = "Allows enabling or disabling launch on startup"
commands.allow = ["set_launch_on_startup"]

[[permission]]
identifier = "allow-is-launch-on-startup"
description = "Allows checking whether launch on startup is enabled"
commands.allow = ["is_launch_on_startup"]

[[permission]]
identifier = "allow-is-tray-available"
description = "Allows checking whether the system tray was set up"
commands.allow = ["is_tray_available"]

[[permission]]
identifier = "allow-tray-status"
description = "Allows reading tray availability diagnostics"
commands.allow = ["tray_status"]

[[permission]]
identifier = "allow-check-for-updates"
description = "Allows checking GitHub Releases for a newer version"
commands.allow = ["check_for_updates"]

[[permission]]
identifier = "allow-open-release-page"
description = "Allows opening the emobie GitHub release page"
commands.allow = ["open_release_page"]

[[permission]]
identifier = "allow-apply-update"
description = "Allows downloading and installing a matching GitHub release asset"
commands.allow = ["apply_update"]

[[permission]]
identifier = "allow-release-single-instance-lock"
description = "Allows releasing the single-instance lock when multiple instances are enabled"
commands.allow = ["release_single_instance_lock"]

[[permission]]
identifier = "allow-quit-app"
description = "Allows quitting the application from the UI"
commands.allow = ["quit_app"]

[[permission]]
identifier = "allow-apply-window-pin"
description = "Allows applying always-on-top / compositor keep-above for the pin button"
commands.allow = ["apply_window_pin"]

[[permission]]
identifier = "allow-pin-capability"
description = "Allows reading whether pin is reliable on this compositor"
commands.allow = ["pin_capability"]

[[permission]]
identifier = "allow-input-helper-status"
description = "Allows querying emobie-inputd status"
commands.allow = ["input_helper_status"]

[[permission]]
identifier = "allow-input-helper-set-enabled"
description = "Allows enabling or disabling as-you-type expansion"
commands.allow = ["input_helper_set_enabled"]

[[permission]]
identifier = "allow-input-helper-sync-matches"
description = "Allows syncing macro matches to emobie-inputd"
commands.allow = ["input_helper_sync_matches"]

[[permission]]
identifier = "allow-input-helper-inject-paste"
description = "Allows requesting a Ctrl+V paste injection"
commands.allow = ["input_helper_inject_paste"]

[[permission]]
identifier = "allow-input-helper-ensure-started"
description = "Allows starting emobie-inputd via systemd or a trusted local binary"
commands.allow = ["input_helper_ensure_started"]

[[permission]]
identifier = "allow-input-helper-run-access-setup"
description = "Allows launching the pkexec keyboard-access setup script"
commands.allow = ["input_helper_run_access_setup"]
