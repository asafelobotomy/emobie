[package]
name = "emobie"
version = "0.6.6"
description = "emobie — compact emoji palette for content creators"
authors = ["aSafeLobotomy"]
edition = "2021"

[lib]
name = "emobie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-single-instance = "2"
ureq = { version = "2", default-features = true, features = ["json"] }
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Match emobie-inputd: skip libei (enigo 0.3 panics without RemoteDesktop portal).
enigo = { version = "0.3", default-features = false, features = ["x11rb", "wayland"] }
ashpd = { version = "0.11", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
