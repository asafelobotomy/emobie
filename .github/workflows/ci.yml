name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            libxkbcommon-dev \
            build-essential \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Check source file line limits
        run: bash scripts/check-loc.sh

      - name: Check inputd packaging maps
        run: bash scripts/check-inputd-packaging.sh

      - name: Check Flatpak cargo sources match both lockfiles
        run: python3 scripts/flatpak-cargo-sources.py --check flatpak/cargo-sources.json src-tauri/Cargo.lock crates/emobie-inputd/Cargo.lock

      - name: Check Tauri command ACL
        run: bash scripts/check-tauri-acl.sh

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Check shared emoji data is up to date
        run: npm run emoji:check

      - name: Check the vendored uq-tokens version
        run: npm run check:uq-tokens

      - name: Typecheck and frontend build
        run: npm run build

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Clippy (app)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Clippy (input helper)
        run: cargo clippy --manifest-path crates/emobie-inputd/Cargo.toml --all-targets -- -D warnings

      - name: Clippy (uQ launcher provider)
        run: cargo clippy --manifest-path crates/emobie-provider/Cargo.toml --all-targets -- -D warnings

      - name: App unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Input helper unit tests
        run: cargo test --manifest-path crates/emobie-inputd/Cargo.toml

      # Includes a private dbus-daemon test (bus activation, Search, Activate).
      - name: uQ launcher provider tests
        run: cargo test --manifest-path crates/emobie-provider/Cargo.toml

  uq:
    name: uQ Settings page
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates

      # The shell expands the glob, so any Node the runner has will do.
      - name: Page logic and manifest tests (Node)
        run: node --test tests/uq/*.test.mjs

      # The fixtures are the real output of the emobie commands; src-tauri/src/cli/tests.rs
      # (the app unit tests above) fails when they drift.
      - name: Page test (QML)
        run: QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # The uQ release whose `uqctl` and settings page test kit this page follows: uq_api 3.
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-v0.3.28
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag v0.3.28 uqctl --root "$HOME/.uq"

      # `--no-programs` skips only the "program exists" check: emobie isn't installed here.
      # Paths and everything else are still checked.
      - name: Check the page with uqctl
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/

  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    strategy:
      matrix:
        manifest: [src-tauri/Cargo.toml, crates/emobie-inputd/Cargo.toml, crates/emobie-provider/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check advisories
