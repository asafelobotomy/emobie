name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.5.0). Leave empty to use package.json version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            PKG_VERSION="$(node -p "require('./package.json').version")"
            TAG="v${PKG_VERSION}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid tag format: $TAG" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"

          if [[ "$VERSION" != "$PKG_VERSION" || "$VERSION" != "$CARGO_VERSION" || "$VERSION" != "$TAURI_VERSION" ]]; then
            echo "Version mismatch. tag=$VERSION package=$PKG_VERSION cargo=$CARGO_VERSION tauri=$TAURI_VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building release $TAG"

  build-linux:
    name: Build Linux packages
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            build-essential \
            file \
            rpm \
            libfuse2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri deb, rpm, and AppImage
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Stage package artifacts
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-release

          DEB="$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)"
          RPM="$(find src-tauri/target/release/bundle/rpm -name '*.rpm' | head -n1)"
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)"

          test -n "$DEB"
          test -n "$RPM"
          test -n "$APPIMAGE"

          cp "$DEB" "dist-release/emobie_${VERSION}_amd64.deb"
          cp "$DEB" flatpak/emobie.deb
          cp "$RPM" "dist-release/emobie-${VERSION}-1.x86_64.rpm"
          cp "$APPIMAGE" "dist-release/emobie_${VERSION}_amd64.AppImage"
          chmod +x "dist-release/emobie_${VERSION}_amd64.AppImage"
          ls -lh dist-release flatpak/emobie.deb

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: emobie-linux
          path: |
            dist-release/*
            flatpak/emobie.deb
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak bundle
    needs: [prepare, build-linux]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: emobie-linux
          path: artifacts

      - name: Prepare Flatpak sources
        run: |
          set -euo pipefail
          cp artifacts/flatpak/emobie.deb flatpak/emobie.deb
          ls -lh flatpak/emobie.deb

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: emobie-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          # Deb-wrap for GitHub Releases. Flathub-bound source build:
          # flatpak/io.github.asafelobotomy.emobie.yml (see docs/FLATHUB.md).
          manifest-path: flatpak/io.github.asafelobotomy.emobie.deb.yml
          cache-key: flatpak-builder-deb-${{ github.sha }}
          branch: stable
          arch: x86_64

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: emobie-flatpak
          path: emobie-${{ needs.prepare.outputs.version }}-x86_64.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-linux, build-flatpak]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          chmod +x scripts/extract-changelog.sh
          NOTES_FILE="release-notes.md"
          {
            echo "## emobie ${VERSION}"
            echo
            ./scripts/extract-changelog.sh "${VERSION}"
            echo
            echo "### Packages"
            echo
            echo "- **Flatpak:** \`emobie-${VERSION}-x86_64.flatpak\`"
            echo "- **Debian/Ubuntu:** \`emobie_${VERSION}_amd64.deb\`"
            echo "- **Fedora/RHEL:** \`emobie-${VERSION}-1.x86_64.rpm\`"
            echo "- **AppImage:** \`emobie_${VERSION}_amd64.AppImage\`"
            echo
            echo "### Install Flatpak"
            echo
            echo '```bash'
            echo "flatpak install --user emobie-${VERSION}-x86_64.flatpak"
            echo "flatpak run io.github.asafelobotomy.emobie"
            echo '```'
            echo
            echo "### Install AppImage"
            echo
            echo '```bash'
            echo "chmod +x emobie_${VERSION}_amd64.AppImage"
            echo "./emobie_${VERSION}_amd64.AppImage"
            echo '```'
            echo
            echo "AppImage does not bundle \`emobie-inputd\`. For text expansion / auto-paste:"
            echo
            echo '```bash'
            echo "bash packaging/install-inputd-user.sh"
            echo "pkexec bash ~/.local/share/emobie/setup-input-access.sh"
            echo '```'
          } > "$NOTES_FILE"
          cat "$NOTES_FILE"

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.flatpak' \
          \) -print -exec cp {} release-files/ \;
          # Keep flatpak/emobie.deb out of the public release if duplicated;
          # named dist-release copies are enough.
          rm -f release-files/emobie.deb
          ls -lh release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: emobie ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
